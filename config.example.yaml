# Copy this file to config.yaml and fill it in. config.yaml is gitignored.

# The Google account this tool belongs to. Every run verifies the authenticated
# account against this value and refuses to continue on a mismatch -- the wrong
# account returns an empty Classroom rather than an error.
account: sahliadam56750652@gmail.com

# IANA name. Timestamps are stored as UTC and converted to this only for display.
timezone: Africa/Tunis

# Database, OAuth token, PDF library and logs all live under here. Relative
# paths resolve against the directory holding this file. The DATA_DIR
# environment variable overrides this.
data_dir: ./data

courses:
  # Course IDs to sync. Populate with `agent courses`.
  #
  # courseState ACTIVE does NOT mean the course is running this term -- it means
  # only that no teacher archived it. This list is curated by hand.
  tracked: []

  # Course IDs to never sync.
  ignored: []

# Where the briefing is sent. The bot token is a credential and lives in .env
# as TELEGRAM_BOT_TOKEN, never here. Both halves are only required when
# something actually sends -- `agent sync` works without either.
#
# To find the chat id: message the bot once, then read
# https://api.telegram.org/bot<token>/getUpdates
telegram:
  chat_id:

# Where study packs are written. Defaults to <data_dir>/library/packs.
# This is the one path deliberately allowed outside data_dir: pointing it at a
# Drive-synced folder is how packs reach NotebookLM without this project ever
# uploading anything (invariant 6 -- drive.readonly cannot upload, and
# NotebookLM has no API). Relative paths resolve against this file's directory.
# packs_dir: ../OneDrive/Classroom packs

# Where my week lives: which subject meets when, so the gate knows what to make
# me revise the evening before. Defaults to timetable.yaml beside this file.
# Relative paths resolve against this file's directory. Copy
# timetable.example.yaml to start one, and check it with `agent timetable
# --check` after every edit.
# timetable_path: timetable.yaml

ocr:
  # How many pages one `agent run` may send for transcription.
  #
  # The arithmetic, because this number is shared with the quiz and the free
  # tier is the binding constraint: Gemini allows roughly 20 requests a day,
  # the scheduler fires `agent run` twice, so 6 x 2 = 12 and about 8 are left
  # for the gate. A quiz costs one request per lecture and then never again --
  # the question set is cached against the text it was generated from -- so 8
  # covers an evening comfortably.
  #
  # Raise it and the quiz is what goes without; that is the trade, and it is
  # worth making deliberately. Set to 0 to leave OCR out of the pipeline.
  run_limit: 6

  # Because this number is small, WHICH pages it spends itself on matters more
  # than the number does. The queue is ordered by the posting date of the
  # material's parent, newest first, and courses in `courses.tracked` come
  # before anything else -- with the ones named in timetable.yaml ahead of the
  # rest, because a subject that meets is a subject the gate will ask about.
  #
  # There is nothing to configure here, deliberately: the ordering is derived
  # from the tracked list and the timetable, which are already the two places
  # that say what this term is. `agent ocr --status` prints the queue so it can
  # be checked rather than trusted, and `agent ocr --course OS` forces one
  # subject to the front for an evening when the gate needs it.

# The revision quiz -- the only thing standing between `reviewed` and
# `verified`.
quiz:
  # How many questions to ask for, 3 to 10.
  #
  # A LONGER QUIZ COSTS THE SAME SINGLE MODEL CALL. The whole set comes back
  # from one request and is then cached against the text it was generated from,
  # so going from four questions to six spends none of the day's ~20 requests.
  # What it spends is my own time, one question at a time on a phone. That is
  # the only trade being made here, and it is worth making: four questions is
  # not much evidence that I read a 92-page lecture.
  #
  # The model may return fewer than asked for and say why -- a lecture too thin
  # to carry six grounded questions, or one where too much of the text is badly
  # transcribed. Fewer honest questions is a better outcome than six invented
  # ones, which is why the pass mark below is a fraction and not a count.
  question_count: 6

  # What fraction of the countable questions has to be right.
  #
  # 0.75 of six questions is FIVE of six, because 4/6 is 0.667 and does not
  # clear the bar. That is deliberate. Guessing at random through four options,
  # six questions gives:
  #
  #     3 of 6   16.9%      (32.0% if one option can be eliminated)
  #     4 of 6    3.8%      (10.0%)
  #     5 of 6    0.5%      ( 1.8%)
  #
  # Four of six is a one-in-ten walk-through for someone who half-remembers the
  # lecture well enough to discard one distractor -- which is precisely the
  # state this gate exists to catch. Five of six is not.
  #
  # It is a fraction rather than a count because the denominator moves: the
  # model may return fewer questions, and a question I flag as bad leaves the
  # count entirely rather than being marked wrong. The same 0.75 means 3 of 4,
  # 4 of 5, 5 of 6, 6 of 7, 6 of 8. The harsh end is a three-question set, which
  # needs 3 of 3 -- rare, and three questions is not much evidence either.
  #
  # A percentage here (75 instead of 0.75) is refused at load rather than
  # making every quiz silently unpassable.
  pass_threshold: 0.75
