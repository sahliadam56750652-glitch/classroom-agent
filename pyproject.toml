[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-agent"
version = "0.1.0"
description = "Personal Google Classroom sync, catch-up tracker and revision gate."
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    # Only 7 files in the tracked courses today (4 .docx, 3 .pptx), but 34
    # account-wide, so they arrive in bulk the moment new courses are tracked.
    # Both are pure Python and build on ARM without a toolchain.
    "python-docx>=1.1",
    "python-pptx>=0.6",
    # Windows ships no IANA time zone database, so zoneinfo cannot resolve
    # Africa/Tunis without this and every displayed deadline would fall back to
    # UTC -- a silent one-hour shift that moves a deadline across midnight.
    # Harmless on the Phase 3 Linux VM, which has its own copy.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
