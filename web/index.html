<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  No `user-scalable=no` and no `maximum-scale`. DESIGN.md section 6 calls
  disabling zoom "the single most common way a reader becomes unusable on a
  phone", and it is one attribute away from happening by accident -- so
  tests/test_web_assets.py asserts this tag stays exactly this shape.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  What the page IS, declared exactly, per theme -- set by the script below and
  by web/theme.js, never left to a default. Light and Bright are "only light",
  Dark "only dark", System "light dark". The "only" is what tells Chrome's
  "dark theme for sites" to keep its hands off: a page that says plain "light"
  is fair game, and it was darkened on the S25 (2026-10-16) -- the light-dark()
  tokens resolved to our Dark values, and Bright's pixels were recoloured.
  tests/test_web_theme.py reproduces it with force-dark on.
-->
<meta name="color-scheme" content="light dark">
<title>Lectern</title>
<link rel="manifest" href="/manifest.webmanifest">
<!-- ONE theme-color, no media query: the status bar follows the app's theme,
     not the phone's. Set to the chosen theme's ground below. -->
<meta name="theme-color" content="#f3efe7">
<!--
  The theme chosen in More, applied before anything paints, so a dark-theme
  phone never flashes paper at 23:00. Same key and same tables as web/theme.js.
  Inline because a module would run after the first paint; nothing fetched.
-->
<script>
  try {
    var chosen = null;
    try {
      chosen = localStorage.getItem("lectern.theme") || localStorage.getItem("margin.theme");
    } catch (e) {}
    var grounds = { light: "#f3efe7", dark: "#171512", bright: "#f4f7fb" };
    var schemes = { light: "only light", dark: "only dark", bright: "only light" };
    var root = document.documentElement;
    var effective = chosen;
    if (grounds[chosen]) {
      root.dataset.theme = chosen;
    } else {
      chosen = "system";
      effective = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    var scheme = schemes[chosen] || "light dark";
    root.style.colorScheme = scheme;
    document.querySelector('meta[name="color-scheme"]').setAttribute("content", scheme);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", grounds[effective]);
  } catch (e) {}
</script>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- The Latin subset, asked for before the stylesheet asks, so the swap from the
     system stack happens on the first paint rather than a moment after it. -->
<link rel="preload" href="/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<!-- One stylesheet per screen, so one screen's redesign reverts on its own. -->
<link rel="stylesheet" href="/styles/more.css">
<link rel="stylesheet" href="/styles/now.css">
<link rel="stylesheet" href="/styles/subjects.css">
<link rel="stylesheet" href="/styles/quiz.css">
<link rel="stylesheet" href="/styles/timetable.css">
<link rel="stylesheet" href="/styles/work.css">
<link rel="stylesheet" href="/styles/library.css">
<link rel="stylesheet" href="/styles/add.css">
<link rel="stylesheet" href="/styles/status.css">
<link rel="stylesheet" href="/styles/reader.css">
<!--
  Load-bearing. `preact-hooks.module.js` imports "preact" as a bare specifier,
  which a browser cannot resolve on its own; without this the app fails at parse
  time with a module resolution error and nothing renders. See web/VENDOR.md.
-->
<script type="importmap">
{
  "imports": {
    "preact": "/vendor/preact.module.js",
    "preact/hooks": "/vendor/preact-hooks.module.js",
    "htm": "/vendor/htm.module.js"
  }
}
</script>
</head>
<body>
<!--
  The app replaces this. It is not a spinner: at 23:00 on mobile data the gap
  between paint and hydrate is real, and a spinner in it would be the app
  performing busyness before it knows anything -- which is what section 4 says
  trains me to stop reading it. One line, no motion.
-->
<div id="app"><p class="booting">…</p></div>
<script type="module" src="/app.js"></script>
</body>
</html>
